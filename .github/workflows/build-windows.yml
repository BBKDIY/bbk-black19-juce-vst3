name: Build Windows VST3 (JUCE Identity Test, real MSVC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DSP verification (framework-independent)
        shell: pwsh
        run: |
          cmake -S . -B build-dsp -DBBK_BUILD_DSP_TEST_ONLY=ON
          cmake --build build-dsp --config Release --target BBKBlack19_DSPTest
          $exe = Get-ChildItem -Path build-dsp -Recurse -Filter "BBKBlack19_DSPTest.exe" | Select-Object -First 1
          if (-not $exe) { throw "BBKBlack19_DSPTest.exe not found - DSP test build failed." }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DSP verification FAILED (exit code $LASTEXITCODE)." }

      - name: Configure (CMake + Visual Studio 17 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --target BBKBlack19_VST3

      - name: Locate the built .vst3
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build -Recurse -Filter "BBK IdentityTest.vst3" | Select-Object -First 1
          if (-not $found) { throw "BBK IdentityTest.vst3 not found under build/ - build likely failed." }
          Write-Host "Found: $($found.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $found.FullName -Destination "dist/BBK IdentityTest.vst3" -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBK-IdentityTest-Windows-VST3-JUCE-MSVC
          path: dist/BBK IdentityTest.vst3
